<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>琬钰老师的辅导员工作台</title>
  <link rel="stylesheet" href="css/style.css?v=20260805">
</head>
<body>
  <!-- 登录界面 -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect x="6" y="6" width="36" height="36" rx="8" fill="#1E4E8C"/>
          <path d="M16 18h16M16 24h16M16 30h10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="login-title">琬钰老师的辅导员工作台</h1>
      <p class="login-subtitle">邮箱登录，数据云端同步</p>
      <div class="login-form">
        <input type="email" id="loginEmail" class="login-input" placeholder="邮箱地址" maxlength="64" autocomplete="email">
        <input type="password" id="loginPassword" class="login-input" placeholder="密码" maxlength="32" autocomplete="current-password">
        <button id="loginBtn" class="login-btn">登 录</button>
        <button id="signUpBtn" class="login-btn login-btn-outline">注册新账号</button>
      </div>
      <p id="loginError" class="login-error"></p>
      <p class="login-hint">登录后数据自动同步云端，换设备登录即可恢复</p>
    </div>
  </div>

  <!-- 首次设置密码界面（仅 Supabase 未配置时显示） -->
  <div id="setupScreen" class="login-screen" style="display:none">
    <div class="login-card">
      <div class="login-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect x="6" y="6" width="36" height="36" rx="8" fill="#1E4E8C"/>
          <path d="M16 18h16M16 24h16M16 30h10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="login-title">首次使用，请设置密码</h1>
      <p class="login-subtitle">设置登录密码后，所有学生数据将受密码保护</p>
      <div class="login-form">
        <input type="password" id="setupPassword" class="login-input" placeholder="请设置密码（至少6位）" maxlength="32">
        <input type="password" id="setupPasswordConfirm" class="login-input" placeholder="请再次输入密码" maxlength="32">
        <button id="setupBtn" class="login-btn">设置密码并进入</button>
      </div>
      <p id="setupError" class="login-error"></p>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="mainApp" class="main-app" style="display:none">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
            <rect x="6" y="6" width="36" height="36" rx="8" fill="#1E4E8C"/>
            <path d="M16 18h16M16 24h16M16 30h10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="sidebar-title">
          <h2>辅导员工作台</h2>
          <p id="sidebarUserName">琬钰老师</p>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="sidebar-logout">退出登录</button>
      </div>
    </aside>

    <!-- 移动端遮罩 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 顶部栏 -->
    <header class="topbar">
      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h1 class="topbar-title" id="topbarTitle">工作台首页</h1>
      <div class="topbar-right">
        <span class="sync-indicator" id="syncIndicator" style="display:none"></span>
        <span class="topbar-date" id="topbarDate"></span>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent"></main>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast"></div>

  <!-- 模态弹窗容器 -->
  <div id="modalContainer" class="modal-container"></div>

  <!-- 文件导入隐藏input -->
  <input type="file" id="fileInput" style="display:none" accept=".xlsx,.xls,.csv">

  <!-- 第三方库 -->
  <script src="assets/xlsx.full.min.js"></script>
  <script src="assets/chart.min.js"></script>
  <script src="assets/supabase.min.js"></script>

  <!-- 应用代码（v=20260805 缓存破坏） -->
  <script src="js/supabase-config.js?v=20260805"></script>
  <script src="js/storage.js?v=20260805"></script>
  <script src="js/sync.js?v=20260805"></script>
  <script src="js/app.js?v=20260805"></script>
</body>
</html>
